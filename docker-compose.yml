# docker-compose.yml для Coolify
#
# Long-syntax для volumes — некоторые версии Coolify игнорируют короткую
# форму `volumes: ['name:/path']`, но long-syntax с `type: volume` и
# `source: name` обрабатывают. Если и это не поможет — переключаемся
# на bind с абсолютным путём (см. закомментированный вариант ниже).
#
# Env остаются в UI Coolify — Compose-режим прокидывает их в контейнер
# автоматически.

services:
  marketplace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace
    ports:
      - "3000:3000"
    volumes:
      - type: volume
        source: marketplace-uploads
        target: /app/app/static/uploads
    restart: unless-stopped

volumes:
  marketplace-uploads:
    name: marketplace-uploads

# === Альтернатива: bind mount, если named volume не подхватывается ===
# Раскомментируй секцию volumes у сервиса и замени при необходимости путь
# `/data/coolify/marketplace-uploads` на каталог, который существует на хосте.
#
#     volumes:
#       - type: bind
#         source: /data/coolify/marketplace-uploads
#         target: /app/app/static/uploads
#
# Перед этим в хост-шелле:
#   mkdir -p /data/coolify/marketplace-uploads
