{% extends "admin/layout.html" %}

{% block title %}Новый параметр - Админ-панель{% endblock %}

{% block content %}
<div class="admin-page-header">
    <h1>Новый параметр</h1>
    <a href="{{ url_for('admin.parameters') }}" class="btn btn-secondary">Назад к списку</a>
</div>

<div class="admin-form-container">
    <form method="POST" action="{{ url_for('admin.parameter_create') }}" class="admin-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="form-group">
            <label for="name">Название параметра *</label>
            <input type="text" id="name" name="name" required
                   class="form-input" placeholder="Например: Размер">
        </div>

        <div class="form-group">
            <label for="code">Код параметра *</label>
            <input type="text" id="code" name="code" required
                   class="form-input" placeholder="Например: size"
                   pattern="[a-z_]+"
                   title="Только строчные латинские буквы и подчёркивания">
            <span class="form-help">Уникальный идентификатор на латинице</span>
        </div>

        <div class="form-group">
            <label for="type">Тип значения *</label>
            <select id="type" name="type" required class="form-select">
                <option value="">Выберите тип</option>
                <option value="string">Строка</option>
                <option value="integer">Число</option>
                <option value="float">Дробное число</option>
                <option value="boolean">Да/Нет</option>
                <option value="select">Выбор из списка</option>
            </select>
        </div>

        <div class="form-group">
            <label for="predefined_values">Предопределённые значения</label>
            <input type="text" id="predefined_values" name="predefined_values"
                   class="form-input" placeholder="XS, S, M, L, XL">
            <span class="form-help">Через запятую (для типа "Выбор из списка")</span>
        </div>

        <div class="form-row">
            <div class="form-checkbox">
                <input type="checkbox" id="is_composite" name="is_composite">
                <label for="is_composite">Составной параметр</label>
            </div>
            <div class="form-checkbox">
                <input type="checkbox" id="is_multiple" name="is_multiple">
                <label for="is_multiple">Множественное значение</label>
            </div>
            <div class="form-checkbox">
                <input type="checkbox" id="is_input" name="is_input">
                <label for="is_input">Можно вводить вручную</label>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Создать параметр</button>
            <a href="{{ url_for('admin.parameters') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
