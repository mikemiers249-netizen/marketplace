{% extends "base.html" %}

{% block title %}{{ link.title }} - Маркетплейс{% endblock %}

{% block content %}
<div class="container">
    <nav aria-label="breadcrumb" style="margin: 15px 0;">
        <ol class="breadcrumb" style="display:flex; gap:6px; list-style:none; padding:0; font-size:13px;">
            <li><a href="{{ url_for('main.index') }}">Главная</a></li>
            <li>/</li>
            <li>{{ link.title }}</li>
        </ol>
    </nav>

    <article class="footer-page" data-footer-slug="{{ link.slug }}" data-display-mode="{{ link.display_mode }}">
        <h1>{{ link.title }}</h1>
        <div class="footer-page-content">
            {{ link.content|safe }}
        </div>
    </article>
</div>
{% endblock %}
