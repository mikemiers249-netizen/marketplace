{% extends "base.html" %}

{% block title %}Регистрация - Маркетплейс{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
                <h1>Регистрация</h1>
                <p class="auth-subtitle">Создайте аккаунт покупателя</p>
                
                <form method="POST" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="form-group">
                        <label for="login">Логин *</label>
                        <input type="text" id="login" name="login" required
                               placeholder="Придумайте логин"
                               minlength="3" maxlength="50">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required
                               placeholder="Ваш email">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Телефон *</label>
                        <input type="tel" id="phone" name="phone" required
                               placeholder="+7 (999) 000-00-00">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль *</label>
                        <input type="password" id="password" name="password" required
                               placeholder="Минимум 8 символов"
                               minlength="8">
                    </div>
                    
                    <div class="form-group">
                        <label for="password_confirm">Подтверждение пароля *</label>
                        <input type="password" id="password_confirm" name="password_confirm" required
                               placeholder="Повторите пароль">
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="agree" required>
                            <span>Согласен с <a href="#">правилами использования</a></span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        Зарегистрироваться
                    </button>
                </form>
                
                <div class="auth-footer">
                    <p>Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
                </div>
                
                <div class="auth-divider">
                    <span>или</span>
                </div>
                
                <div class="seller-link">
                    <p>Хотите продавать? <a href="{{ url_for('auth.seller_signup') }}">Стать продавцом</a></p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}
