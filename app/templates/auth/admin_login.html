{% extends "base.html" %}

{% block title %}Вход для администратора{% endblock %}

{% block content %}
<div class="auth-page admin-auth">
    <div class="auth-container">
            <div class="auth-card admin-card">
                <div class="auth-header">
                    <h1>Админ-панель</h1>
                    <p class="auth-subtitle">Введите учётные данные администратора</p>
                </div>
                
                <form method="POST" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="form-group">
                        <label for="login">Логин</label>
                        <input type="text" id="login" name="login" required
                               placeholder="Введите логин">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" required
                               placeholder="Введите пароль">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        Войти
                    </button>
                </form>
                
                <div class="auth-footer">
                    <p><a href="{{ url_for('main.index') }}">Вернуться на сайт</a></p>
                </div>
            </div>
        </div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<style>
    .admin-card {
        max-width: 400px;
        margin: 50px auto;
    }
</style>
{% endblock %}
