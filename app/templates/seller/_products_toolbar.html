{% macro products_toolbar(filters, add_url) %}
<div class="products-filters">
    <div class="filter-tabs">
        {% for filter in filters %}<a href="{{ filter.url }}" class="filter-tab{% if filter.active %} active{% endif %}">{{ filter.label }}</a>{% endfor %}
    </div>
    <div class="products-actions">
        <a href="{{ add_url }}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Добавить товар</a>
    </div>
</div>
{% endmacro %}
